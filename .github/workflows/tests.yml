name: tests

on:
  push:
    branches: [main]
  pull_request:

# 新推送自动取消在跑的旧任务（省额度，也防止卡死的旧任务挂黄点）
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        # -v：逐条打印测试名——若有测试在 CI 上挂死，日志最后一行就是凶手
        run: python -m unittest discover -s tests -v
        # 无卡里布环境下测试自动回落到 characters/example（见 README 开发者小节）；
        # duo_sim 相关 27 条 skip 属预期（缺私有画像简报）。
