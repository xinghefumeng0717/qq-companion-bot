name: tests

on:
  push:
    branches: [main]
  pull_request:

# 新推送自动取消在跑的旧任务（省额度，也防止卡死的旧任务挂黄点）
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.set.outputs.files }}
    steps:
      - uses: actions/checkout@v4
      - id: set
        run: echo "files=$(ls tests/test_*.py | jq -R -s -c 'split("\n")[:-1]')" >> "$GITHUB_OUTPUT"

  # 每个测试文件一个并行 job：哪个文件挂死，对应 job 超时可疑，
  # 从 jobs 列表页/API 直接看得出来，不用下载日志
  unittest:
    needs: list
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJSON(needs.list.outputs.files) }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run ${{ matrix.file }}
        run: python -m unittest discover -s tests -p "$(basename '${{ matrix.file }}')"
        # 无卡环境下测试自动回落到 characters/example（见 README 开发者小节）；
        # duo_sim 相关 skip 属预期（缺私有画像简报）。
