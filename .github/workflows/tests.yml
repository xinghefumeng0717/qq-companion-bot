name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests
        # 无卡里布环境下测试自动回落到 characters/example（见 README 开发者小节）；
        # duo_sim 相关 27 条 skip 属预期（缺私有画像简报）。
