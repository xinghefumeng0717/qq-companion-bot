[account]
allowed_user_id = 123456789        # 机主大号 QQ 号，只响应此人，其余一律忽略
bot_qq = 987654321                 # 小号 QQ 号（日志用）

[onebot]
ws_url = "ws://127.0.0.1:3001"
access_token = "在这里填 NapCat 设置的 token"

[llm]
current = "deepseek"          # 当前激活的模型预设，切换只改这一行
thinking_chat = true
thinking_effort_chat = "low"
thinking_tasks = false               # 后台总开关：true 则全部用途开思考（旧行为）
thinking_effort_tasks = "low"
# 总开关关闭时，按用途白名单开思考（默认即下列四项：写出来的文字用户看得见，不思考的 flash 行文会不通顺）
# ⚠ 手工填写本字段时须包含 life_arc（她的生活主线）——写了白名单却漏掉它，
#   主线生成会静默退回不思考，FIXES16 的效果等于没上。整行删掉则用代码默认值（同样含 life_arc）。
thinking_tasks_purposes = ["diary_archive", "vision_perception", "proactive_message", "life_arc"]

# 每个 [models.<名>] 是一家厂商的完整档案
[models.deepseek]
provider = "deepseek"         # deepseek / minimax / openai（generic，不传任何思考参数）
base_url = "https://api.deepseek.com"
api_key = "sk-在这里填"
chat = "deepseek-flash"
vision = "deepseek-flash"     # 留空字符串则禁用识图
tasks = "deepseek-flash"

[models.minimax]
provider = "minimax"
base_url = "https://api.minimaxi.com/v1"
api_key = "在这里填"
chat = "MiniMax-M3"
vision = "MiniMax-M3"
tasks = "MiniMax-M2.7"

[models.seed]
provider = "openai"
base_url = "https://ark.cn-beijing.volces.com/api/v3"
api_key = "在这里填"
chat = "doubao-seed-2-1-pro-260915"
vision = "doubao-seed-2-1-pro-260915"
tasks = "doubao-seed-2-1-turbo-260628"
# DeepSeek 计费（元/百万 tokens，按北京时间判峰谷、按模型分表，需按官网更新）
[llm.pricing]
holidays = []                # 中国法定节假日，如 ["2026-10-01"]，留空则仅按工作日规则

[llm.pricing."deepseek-flash"]
cache_hit_peak = 0.04        # 输入·缓存命中·高峰
cache_hit_offpeak = 0.02     # 输入·缓存命中·空闲
cache_miss_peak = 2.0        # 输入·缓存未命中·高峰
cache_miss_offpeak = 1.0     # 输入·缓存未命中·空闲
output_peak = 8.0            # 输出·高峰
output_offpeak = 4.0         # 输出·空闲

[llm.pricing."deepseek-v4-pro"]
cache_hit_peak = 0.30
cache_hit_offpeak = 0.15
cache_miss_peak = 9.0
cache_miss_offpeak = 4.5
output_peak = 27.0
output_offpeak = 13.5

[character]
path = "characters/example"        # 当前激活的角色卡目录

[reply]
max_chunks = 5                     # 单轮最多拆几条发送
chunk_delay_min = 0.8              # 段间延迟秒数下限
chunk_delay_max = 2.2

[proactive]
enabled = true
wake_interval_min = 20             # 唤醒间隔（分钟）下限，每次随机取 [min,max]
wake_interval_max = 40
quiet_hours = [0, 8]               # 免打扰时段
max_unanswered = 2                 # 连续 N 条主动消息未获回复，当天停止

# 回复时机人格化（FIXES15）——**整节删掉也能跑**，缺字段全部走代码默认值
# 两个开关互相独立：timing_enabled 只管"拿起手机"的首条延迟，
# typing_indicator_enabled 只管发送前的"正在输入"表演；全 false 即回到改动前行为。
[timing]
timing_enabled = true                 # 首条回复延迟总开关（false = 秒回）
typing_indicator_enabled = true       # 发送前"正在输入"表演总开关
first_reply_busy_delay_min = 60.0     # 首条·忙（作息表命中上课/练琴/睡觉）：延迟下限（秒）
first_reply_busy_delay_max = 600.0    # 首条·忙：延迟上限（秒），与上一行合起来是 1~10 分钟
first_reply_free_delay_min = 5.0      # 首条·闲（在度过属于自己的时间/长假）：延迟下限（秒）
first_reply_free_delay_max = 30.0     # 首条·闲：延迟上限（秒）
active_conversation_window = 300.0    # 对话激活窗口（秒）：窗口内她回过话就算"聊着呢"，后续回复不再延迟
typing_seconds_per_10chars = 2.0      # "正在输入"时长：每 10 字 2 秒
typing_min = 3.0                      # "正在输入"最短展示（秒）
typing_max = 25.0                     # "正在输入"最长展示（秒）

[voice]
enabled = true
model_dir = "data/models/sensevoice"

# 语音回复（FIXES22 阶段 A + 阶段 B 海螺适配）——**默认关**，建议等文字层稳定后再手动开
# 整个段删掉也能跑：代码默认值兜底，结果一样是"装着但关着"
[tts]
enabled = false                    # ← 要开启改这里（默认 false = 新功能先装死）
provider = "edge"                  # 合成引擎："edge"=微软 edge-tts（零成本，默认，阶段 A 路径保留）
                                   #           "minimax"=海螺 MiniMax（音色更好，走会员套餐额度）

# ── 下面两行只在 provider = "edge" 时生效 ──
voice = "zh-CN-XiaoxiaoNeural"     # edge 预置音色（晓晓被所有者亲耳否决，仅留作回退用）
rate = "-8%"                       # edge 语速微调；+10%~+20% 会更活泼

# ── 下面四行只在 provider = "minimax" 时生效（默认即定稿值，一般不用改）──
# 鉴权 key 不在这里填：复用现有 [models.minimax].api_key（t2a_v2 实测不需要 GroupId）
voice_id = "Chinese (Mandarin)_Gentle_Senior"   # 海螺音色：温柔学姐（所有者盲听 5 个候选后亲选）
speed = 1.0                        # 海螺语速：1.0 原速（0.9 慢速版已被淘汰）
model = "speech-2.8-hd"            # 海螺 t2a_v2 模型，只能填官方枚举（…-hd 或 …-turbo）
group_id = ""                      # 留空即可：t2a_v2 不需要 GroupId（那是老接口的查询参数）

daily_limit = 8                    # 每日语音条数上限（所有者 2026-10-05 拍板 8 条；上限是防抖动的保险丝）
max_chars = 60                     # 单条字数上限（≈20 秒；NapCat 超过 35s 有失败报告）

[admin]
host = "127.0.0.1"
port = 8080
